<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta name="mobile-web-app-capable" content="yes"><title>AsoLand</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="preload" href="logo.svg" as="image"><link rel="stylesheet" href="styles.css?v=44"></head><body><div id="splash" class="splash"><div class="splash-orb"></div><img src="logo.svg" class="splash-logo" alt="AsoLand"><div class="splash-name">AsoLand</div><div class="splash-loader"><span></span><span></span><span></span></div></div><div id="app">
