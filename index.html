<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AsoLand MiniApp</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="app-container">
    <header class="profile-header">
      <div class="logo-wrapper">
        <img src="logo.svg" alt="AsoLand Logo">
      </div>
      <h1 class="app-title">AsoLand</h1>
      <p class="app-subtitle" id="user-welcome">در حال دریافت اطلاعات کاربر...</p>
    </header>

    <section class="stats-card">
      <div class="stat-item">
        <div class="stat-value" id="user-status">فعال</div>
        <div class="stat-label">وضعیت حساب</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="user-id">---</div>
        <div class="stat-label">شناسه کاربر</div>
      </div>
    </section>

    <button class="btn-main" id="main-action-btn">
      <span>تایید و ادامه</span>
    </button>
  </main>

  <script src="app.js"></script>
</body>
</html>
